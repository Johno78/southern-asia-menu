<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takeaways</title>
<meta name="theme-color" content="#262029">
<meta name="description" content="Takeaway menus for the Isle of Man, with a running order total.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Takeaways">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: ink-coloured header, then one tall card per takeaway in its own brand colour, with live open/closed status. */
:root{
  color-scheme:light;
  --bg:#F4F1F2; --surface:#FFFFFF; --fg:#211C24; --muted:#6A6270; --line:#E1DADD;
  --head:#262029; --head-fg:#F8F2F4; --head-soft:rgba(248,242,244,.7);
  --ok:#1F7A45; --shadow:rgba(33,28,36,.14);
  --display:'Fredoka','Trebuchet MS',Arial,sans-serif;
  --sans:'Figtree','Helvetica Neue',Arial,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121014; --surface:#1E1A22; --fg:#F2ECF3; --muted:#A99FB0; --line:#332C38;
    --head:#1A161D; --head-fg:#F8F2F4; --head-soft:rgba(248,242,244,.7);
    --ok:#4CC27F; --shadow:rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121014; --surface:#1E1A22; --fg:#F2ECF3; --muted:#A99FB0; --line:#332C38;
  --head:#1A161D; --head-fg:#F8F2F4; --head-soft:rgba(248,242,244,.7);
  --ok:#4CC27F; --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{margin:0}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.wrap{max-width:40rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid #F06AAA;outline-offset:2px}
header{background:var(--head);color:var(--head-fg)}
header .wrap{padding-block:1.6rem 1.4rem;position:relative}
.cn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:.5rem;font:600 4.4rem/1 var(--display);opacity:.12;pointer-events:none;user-select:none}
.kicker{margin:0;font:800 .75rem/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--head-soft)}
h1{margin:.35rem 0 .3rem;font:600 clamp(2.4rem,11vw,3.4rem)/1 var(--display)}
.lede{margin:0;color:var(--head-soft);font-size:.95rem;max-width:30rem}
main.wrap{padding-block:1.2rem 2rem;display:grid;gap:1rem}
.card{background:var(--surface);border-radius:.9rem;overflow:hidden;box-shadow:0 2px 10px var(--shadow)}
.top{background:var(--brand);color:#fff;padding:1rem 1rem .9rem;position:relative;overflow:hidden}
.top .mark{position:absolute;right:.8rem;top:.2rem;font:600 3.6rem/1 var(--display);opacity:.18;pointer-events:none;user-select:none}
.top h2{margin:0;font:600 1.7rem/1.1 var(--display)}
.top p{margin:.2rem 0 0;font-size:.9rem;opacity:.85}
.body{padding:.9rem 1rem 1rem;display:grid;gap:.8rem}
.status{display:inline-flex;align-items:center;gap:.5rem;font:600 .88rem/1.2 var(--sans);color:var(--muted)}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:#A59DAB;flex:none}
.status.open{color:var(--ok)}
.status.open .dot{background:var(--ok)}
.facts{margin:0;color:var(--muted);font-size:.88rem;line-height:1.45}
.actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{flex:1 1 9rem;padding:.8rem 1rem;border-radius:.6rem;border:1.5px solid var(--brand);background:var(--brand);color:#fff;font:800 .95rem var(--sans);text-align:center;text-decoration:none}
.btn.alt{background:transparent;color:var(--fg);border-color:var(--line)}
.foot{margin:.4rem 0 0;color:var(--muted);font-size:.82rem;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="cn" aria-hidden="true">外卖</span>
    <p class="kicker">Isle of Man</p>
    <h1>Takeaways</h1>
    <p class="lede">Menus to search, with a running order total and the dish numbers to read out when you ring.</p>
  </div>
</header>
<main class="wrap" id="list"></main>
<div class="wrap"><p class="foot">Menus are typed from printed copies and prices can change, so check when you order. Opening hours come from each shop's own menu or listing.</p></div>
<script>
(function(){
var LUNCH=[690,830];
var PLACES=[
 {name:'Southern Asia',area:'Strand Road, Port Erin',href:'southern-asia.html',phone:'01624 836516',brand:'#A91D1A',mark:'南亚',
  facts:'137 numbered dishes plus Chef\'s Specials. Closed Tuesdays.',
  hours:{Sun:[[1020,1380]],Mon:[[1020,1380]],Tue:[],Wed:[[1020,1380]],Thu:[[1020,1380]],Fri:[[1020,1440]],Sat:[[1020,1440]]}},
 {name:'Yummy House',area:'Cushag Road, Anagh Coar, Douglas',href:'yummy-house.html',phone:'01624 609609',brand:'#6B2160',mark:'好吃',
  facts:'220 numbered dishes, set meals and Munchy Boxes. Delivery 5:30pm to 9:30pm, minimum £15.',
  hours:{Sun:[[990,1320]],Mon:[[990,1320]],Tue:[[990,1320]],Wed:[LUNCH,[990,1320]],Thu:[LUNCH,[990,1320]],Fri:[LUNCH,[990,1350]],Sat:[[990,1350]]}}
];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var FULL={Sun:'Sunday',Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(m){if(m===1440)return 'midnight';var h=Math.floor(m/60),mi=m%60;return (h%12||12)+(mi?':'+('0'+mi).slice(-2):'')+(h>=12?'pm':'am');}
function ukNow(){
  var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  function g(t){for(var i=0;i<p.length;i++){if(p[i].type===t)return p[i].value;}return '';}
  return {d:g('weekday'),m:(+g('hour'))*60+(+g('minute'))};
}
function statusFor(pl){
  try{
    var n=ukNow(),idx=DAYS.indexOf(n.d);
    if(idx<0)throw new Error('day');
    var today=pl.hours[n.d],i,j;
    for(j=0;j<today.length;j++){if(n.m>=today[j][0]&&n.m<today[j][1])return {open:true,text:'Open now until '+fmt(today[j][1])};}
    for(i=0;i<=7;i++){
      var d=DAYS[(idx+i)%7],rs=pl.hours[d];
      for(j=0;j<rs.length;j++){
        if(i>0||rs[j][0]>n.m)return {open:false,text:'Closed, opens '+(i===0?'today':i===1?'tomorrow':FULL[d])+' at '+fmt(rs[j][0])};
      }
    }
  }catch(e){}
  return {open:false,text:'See the menu for opening hours'};
}
function render(){
  var el=document.getElementById('list');
  el.innerHTML=PLACES.map(function(p){
    var s=statusFor(p);
    return '<article class="card" style="--brand:'+p.brand+'"><div class="top"><span class="mark" aria-hidden="true">'+esc(p.mark)+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.area)+'</p></div>'+
      '<div class="body"><span class="status'+(s.open?' open':'')+'"><span class="dot"></span>'+esc(s.text)+'</span><p class="facts">'+esc(p.facts)+'</p>'+
      '<div class="actions"><a class="btn" href="'+esc(p.href)+'">View menu</a><a class="btn alt" href="tel:'+esc(p.phone.replace(/\s/g,''))+'">Call shop</a></div></div></article>';
  }).join('');
}
render();setInterval(render,60000);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
